<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    {% load static %}
    <link
      href="{% static 'subject/style.css' %}"
      type="text/css"
      rel="stylesheet"
    />
    <script src="{% static 'subject/subject.js' %}"></script>
    <title>카테고리 관리</title>
  </head>
  <body>
    <section>
      <header>
        <div class="app_title">학습 관리 시스템</div>
      </header>
    </section>
    <form method="POST">
      <section>
        {% csrf_token %} {{form.name.label_tag }} {{ form.name }}
        <button type="submit" name="action" value="update">등록</button>
        <button
          type="button"
          id="add_subject"
          onclick="location.href='{% url 'subject_add_view' %}'"
        >
          이전화면
        </button>
      </section>
    </form>

    <hr />
    <form method="POST">
      <section>
        {% csrf_token %}
        <h2>카테고리 목록</h2>
        <button type="submit" name="action" value="delete">삭제</button>
        {% for category in categories %}
        <input
          type="checkbox"
          class="category_checkbox"
          name="select"
          value="{{ category.category_key }}"
        />
        {{ category.name }} {% endfor %}
      </section>
    </form>
  </body>
</html>
