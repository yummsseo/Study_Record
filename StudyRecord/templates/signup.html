{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - StudyRecord</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="auth-wrapper">
        <!-- 왼쪽 비주얼 섹션 -->
        <div class="auth-visual">
            <div class="visual-content">
                <h1 class="visual-title">📚StudyRecord📚</h1>
            </div>
        </div>

        <!-- 오른쪽 폼 섹션 -->
        <div class="auth-content">
            <div class="signup-container">
                <h2>회원가입</h2>
                <p class="subtitle">새로운 계정을 ㄴ만들어보세요</p>
                
                <div id="signup-status"></div>
                
                <form class="form" onsubmit="signupUser(event)">
                    <div class="input-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" name="username" 
                               placeholder="아이디를 입력하세요" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" 
                               placeholder="example@email.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" 
                               placeholder="8자 이상 입력하세요" required>
                    </div>
                    
                    <input type="submit" value="회원가입" class="create-btn">
                </form>
                
                <div class="return-link">
                    이미 계정이 있으신가요? <a href="{% url 'login_html' %}">로그인</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/signup.js' %}"></script>
</body>
</html>
